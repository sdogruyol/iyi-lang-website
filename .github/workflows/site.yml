name: site

# The site restates the iyi repository: every number and listing on it is
# generated at build time from that tree (README.md, SPEC.md, CHANGELOG.md,
# `samples/`, `bench/doc_numbers.py`). So the build checks iyi out beside this
# repository - the sibling `iyi/` the scripts look for by default - and runs
# the same generators a developer runs locally.
#
# The records under `records/` (wasm modules, diagnostics, highlighting) are
# committed, produced on a machine with the compiler and wasi-sdk by
# `npm run record`; the build only checks that they still describe the
# iyi tree it was given, and refuses to publish if they do not.

on:
  push:
    branches: [main]
  # Pull requests build and gate, and do not deploy. Until this line the
  # workflow only ran after a merge, so every gate in it - the citations, the
  # type-check, the prose, the links, the budget - reported a defect that was
  # already on main. A publication that refuses a transcribed number and then
  # learns about a broken link from its own deploy is checking in the wrong
  # order.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time on main, because Pages has one live site. A pull
  # request is a different question - "is this branch publishable" - so it gets
  # its own group, and a superseded push to it cancels the run it made obsolete
  # rather than holding a runner to answer about a commit nobody will merge.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      # Full history and the tags, not a shallow clone. Two things need them:
      # bench/site_facts.py counts commits and authors for the contribution
      # section, and refuses to publish a count taken from a truncated history
      # rather than printing a smaller number with the same confidence as a
      # true one; and scripts/records.mjs reads every recorded file out of the
      # tag CHANGELOG.md names, because a record is evidence about a release
      # and not about whatever master happens to be. A clone with no tags
      # fails the build by name rather than falling back to the checkout.
      - uses: actions/checkout@v4
        with:
          repository: iyilang/iyi
          path: iyi
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The paths the documents cite
        working-directory: site
        run: python3 bench/website_citations.py

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # Type-check before building. `astro check` is the only gate that reads
      # the pages as TypeScript, and the generated JSON they import is typed
      # by its own shape, so a page that reads a field a generator stopped
      # writing fails here rather than rendering the word "undefined".
      - name: Type-check the pages
        working-directory: site
        run: npm run check

      # `npm run build` is the whole chain and it is the same one a developer
      # runs: `generate` (facts, targets, releases, samples, records, then the
      # contrast, transcription and blocker gates), `astro build`, then
      # `postbuild` - the three gates that can only read the built output:
      #
      #   prose.mjs   a word welded to the next one across an inline element
      #   links.mjs   an href, src or #fragment that resolves to nothing, and
      #               an <img> with no alt; no external URL is fetched
      #   budget.mjs  the bytes a first view of each route fetches, against
      #               the ratchet in scripts/budget.json
      #
      # They run here rather than as separate steps for the reason the rest of
      # this repository exists: CI and a laptop must run one chain, or the
      # build that passes locally is not the build that publishes.
      - name: Generate, build, and gate the built site
        working-directory: site
        run: npm run build

      # Pages only from main or a dispatch. A pull request has answered the
      # question it was asked once the gates above pass, and on a fork the
      # token has no pages scope, so configuring Pages there would fail for a
      # reason that says nothing about the branch.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  # `needs: build` is the gate: every check above - the citations, the
  # type-check, the generators, the records, the prose, the links, the budget -
  # runs in that job, so nothing reaches the live site without passing all of
  # them. A pull request never gets here, and it has no artifact to deploy.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
